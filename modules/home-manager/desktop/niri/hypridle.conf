general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # after_sleep_cmd must be a single executable + args; wrap complex pipelines in bash -c.
    # The sleep gives Thunderbolt ~3s to enumerate displays before power-on-monitors fires.
    after_sleep_cmd = bash -c 'sleep 3 && niri msg action power-on-monitors; systemctl --user restart kanshi.service; systemctl --user restart waybar'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
