general {
    # Keep the cursor visible so the on-screen power buttons can be clicked.
    hide_cursor = false
    ignore_empty_input = true
}

# Concurrent password (PAM) + fingerprint (fprintd over D-Bus)
auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or type password
        present_message = Scanning fingerprint...
    }
}

# BACKGROUND
background {
    monitor =
    path = @WALLPAPER@
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 130
    font_family = Roboto Bold
    position = 0, 240
    halign = center
    valign = center
}

# DAY, DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = Roboto Bold
    position = 0, 105
    halign = center
    valign = center
}

# WEATHER (refreshed hourly; niri/weather.sh, pattern from JaKooLit/Hyprland-Dots)
label {
    monitor =
    text = cmd[update:3600000] /home/yhattori/.config/niri/weather.sh
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = Roboto
    position = 40, 40
    halign = left
    valign = top
}

# JOKE / FUN FACT OF THE HOUR (hourly; niri/quote.sh -> icanhazdadjoke.com / popcat.xyz)
label {
    monitor =
    text = cmd[update:3600000] /home/yhattori/.config/niri/quote.sh
    color = rgba(216, 222, 233, 0.75)
    font_size = 18
    font_family = Roboto
    text_align = center
    position = 0, 190
    halign = center
    valign = bottom
}

# PROFILE PHOTO
image {
    monitor =
    path = @AVATAR@
    border_color = 0xffdddddd
    border_size = 0
    size = 120
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hi, $USER
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = Roboto Bold
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Roboto Bold
    placeholder_text = <i><span foreground="##ffffff99">Password or fingerprint</span></i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# FINGERPRINT STATUS
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(255, 255, 255, 0.5)
    font_size = 14
    font_family = Roboto
    position = 0, -300
    halign = center
    valign = center
}

# POWER BUTTONS
# Icon row adapted from MrVivekRajan/Hyprlock-Styles Style-10 (the collection
# this lock screen's Style-9 comes from), made clickable via hyprlock's
# `onclick`. hyprlock only supports clicks on shape/label/image, so each button
# is a rounded shape with a matching glyph label on top. These fire WITHOUT
# unlocking, like the Windows lock screen.
# SLEEP
shape {
    monitor =
    size = 72, 72
    rounding = 18
    color = rgba(255, 255, 255, 0.08)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.15)
    position = -140, -440
    halign = center
    valign = center
    onclick = systemctl suspend
}
label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = -140, -440
    halign = center
    valign = center
    onclick = systemctl suspend
}

# RESTART
shape {
    monitor =
    size = 72, 72
    rounding = 18
    color = rgba(255, 255, 255, 0.08)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.15)
    position = 0, -440
    halign = center
    valign = center
    onclick = systemctl reboot
}
label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.6)
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 0, -440
    halign = center
    valign = center
    onclick = systemctl reboot
}

# SHUT DOWN
shape {
    monitor =
    size = 72, 72
    rounding = 18
    color = rgba(255, 255, 255, 0.08)
    border_size = 2
    border_color = rgba(255, 255, 255, 0.15)
    position = 140, -440
    halign = center
    valign = center
    onclick = systemctl poweroff
}
label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 140, -440
    halign = center
    valign = center
    onclick = systemctl poweroff
}
