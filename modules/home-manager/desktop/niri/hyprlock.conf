general {
    hide_cursor = true
    ignore_empty_input = true
}

# Concurrent password (PAM) + fingerprint (fprintd over D-Bus)
auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or type password
        present_message = Scanning fingerprint...
    }
}

# BACKGROUND
background {
    monitor =
    path = @WALLPAPER@
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 130
    font_family = Roboto Bold
    position = 0, 240
    halign = center
    valign = center
}

# DAY, DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = Roboto Bold
    position = 0, 105
    halign = center
    valign = center
}

# NOW PLAYING (via playerctl; blank when nothing is playing)
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '  {{title}} — {{artist}}' 2>/dev/null
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = Roboto
    position = 0, 60
    halign = center
    valign = bottom
}

# PROFILE PHOTO
image {
    monitor =
    path = @AVATAR@
    border_color = 0xffdddddd
    border_size = 0
    size = 120
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hi, $USER
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = Roboto Bold
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Roboto Bold
    placeholder_text = <i><span foreground="##ffffff99">Password or fingerprint</span></i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# FINGERPRINT STATUS
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(255, 255, 255, 0.5)
    font_size = 14
    font_family = Roboto
    position = 0, -300
    halign = center
    valign = center
}
